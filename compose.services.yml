services:
  catalog:
    build: {context: ., dockerfile: Dockerfile.backend}
    command: python -m uvicorn backend.data_catalog_service.app:app --host 0.0.0.0 --port 8016
    expose: ["8016"]
    environment:
      SERVICE_PORT: 8016
      DATA_CATALOG_STORAGE: /data/catalog
      CATALOG_SERVICE_TOKEN: "${CATALOG_SERVICE_TOKEN:?set CATALOG_SERVICE_TOKEN}"
    volumes: ["catalog-data:/data/catalog"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/healthz')"], interval: 10s, timeout: 3s, retries: 10}
  data-products:
    build: {context: ., dockerfile: Dockerfile.backend}
    command: python -m uvicorn backend.data_product_service.app:app --host 0.0.0.0 --port 8017
    expose: ["8017"]
    environment:
      SERVICE_PORT: 8017
      DATA_PRODUCT_STORAGE: /data/products
      DATA_PRODUCT_ALLOWED_ARTIFACT_ROOTS: /data/artifacts
      ARTIFACT_STORAGE: /data/artifacts
      DATA_CATALOG_URL: http://catalog:8016/api/v1
      CATALOG_SERVICE_TOKEN: "${CATALOG_SERVICE_TOKEN:?set CATALOG_SERVICE_TOKEN}"
      DATA_PRODUCT_APPROVAL_TOKEN: "${DATA_PRODUCT_APPROVAL_TOKEN:?set DATA_PRODUCT_APPROVAL_TOKEN}"
      AUTH_MODE: ${AUTH_MODE:-development}
      REQUIRED_APPROVER_ROLE: ${REQUIRED_APPROVER_ROLE:-DataProduct.Approver}
    volumes: ["product-data:/data/products", "artifacts-data:/data/artifacts"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8017/healthz')"], interval: 10s, timeout: 3s, retries: 10}
    depends_on:
      catalog:
        condition: service_healthy
  data-product-outbox:
    build: {context: ., dockerfile: Dockerfile.backend}
    command: python -m backend.data_product_service.worker
    environment:
      DATA_PRODUCT_STORAGE: /data/products
      DATA_CATALOG_URL: http://catalog:8016/api/v1
      CATALOG_SERVICE_TOKEN: "${CATALOG_SERVICE_TOKEN:?set CATALOG_SERVICE_TOKEN}"
      DATA_PRODUCT_RECONCILE_SECONDS: ${DATA_PRODUCT_RECONCILE_SECONDS:-30}
    volumes: ["product-data:/data/products"]
    depends_on:
      catalog:
        condition: service_healthy
  qif:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m uvicorn backend.qif.app:app --host 0.0.0.0 --port 8010
    expose: ["8010"]
    environment:
      SERVICE_PORT: 8010
      ONTOLOGY_SERVICE_URL: http://ontology:8011/api/v1
      GRAPH_SERVICE_URL: http://graph:8013/api/v1
      ARTIFACT_STORAGE: /data/artifacts
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      ontology:
        condition: service_healthy
      graph:
        condition: service_healthy
    volumes: ["artifacts-data:/data/artifacts"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz')"], interval: 10s, timeout: 3s, retries: 10}

  agentic:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m uvicorn backend.agentic_service.app:app --host 0.0.0.0 --port 8012
    expose: ["8012"]
    environment:
      SERVICE_PORT: 8012
      ONTOLOGY_SERVICE_URL: http://ontology:8011/api/v1
      GRAPH_SERVICE_URL: http://graph:8013/api/v1
      INGESTION_SERVICE_URL: http://ingestion:8014/api/v1
      OSLC_SERVICE_URL: http://oslc:8015/api/v1
      QIF_SERVICE_URL: http://qif:8010/api/v1
      DATA_CATALOG_URL: http://catalog:8016/api/v1
      DATA_PRODUCT_SERVICE_URL: http://data-products:8017/api/v1
      AGENTIC_APPROVAL_TOKEN: ${AGENTIC_APPROVAL_TOKEN:?set AGENTIC_APPROVAL_TOKEN}
      AUTH_MODE: ${AUTH_MODE:-development}
      REQUIRED_APPROVER_ROLE: ${REQUIRED_APPROVER_ROLE:-DataProduct.Approver}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      ontology:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      qif:
        condition: service_healthy
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/healthz')"], interval: 10s, timeout: 3s, retries: 10}

  ontology:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m uvicorn backend.ontology_service.app:app --host 0.0.0.0 --port 8011
    expose: ["8011"]
    environment:
      ONTOLOGY_SERVICE_STORAGE: /data/ontology_service
      ARTIFACT_STORAGE: /data/artifacts
      SERVICE_PORT: 8011
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    # Approved ontology artifacts can be copied here for data-product publication.
    volumes: ["ontology-data:/data/ontology_service", "artifacts-data:/data/artifacts"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/healthz')"], interval: 10s, timeout: 3s, retries: 10}

  graph:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m uvicorn backend.graph_service.app:app --host 0.0.0.0 --port 8013
    expose: ["8013"]
    environment:
      SERVICE_PORT: 8013
      NEO4J_URI: ${NEO4J_URI:-neo4j://host.docker.internal:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASS: ${NEO4J_PASS:?set NEO4J_PASS in your environment}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-ontology}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/healthz')"], interval: 10s, timeout: 3s, retries: 10}

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m uvicorn backend.ingestion_service.app:app --host 0.0.0.0 --port 8014
    expose: ["8014"]
    environment:
      SERVICE_PORT: 8014
      ONTOLOGY_SERVICE_URL: http://ontology:8011/api/v1
      GRAPH_SERVICE_URL: http://graph:8013/api/v1
      ARTIFACT_STORAGE: /data/artifacts
      SEMANTIC_GRAPH_PROVIDER: ${SEMANTIC_GRAPH_PROVIDER:-neo4j}
      NEO4J_URI: ${NEO4J_URI:-neo4j://host.docker.internal:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASS: ${NEO4J_PASS:?set NEO4J_PASS in your environment}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-ontology}
      RAPIDMINER_SEMANTIC_GRAPH_URL: ${RAPIDMINER_SEMANTIC_GRAPH_URL:-}
      RAPIDMINER_USER: ${RAPIDMINER_USER:-}
      RAPIDMINER_TOKEN: ${RAPIDMINER_TOKEN:-}
      ORACLE_SEMANTIC_GRAPH_DSN: ${ORACLE_SEMANTIC_GRAPH_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_SEMANTIC_GRAPH_MODEL: ${ORACLE_SEMANTIC_GRAPH_MODEL:-}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      ontology:
        condition: service_healthy
      graph:
        condition: service_healthy
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["artifacts-data:/data/artifacts"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8014/healthz')"], interval: 10s, timeout: 3s, retries: 10}

  oslc:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m uvicorn backend.oslc_service.app:app --host 0.0.0.0 --port 8015
    expose: ["8015"]
    environment:
      SERVICE_PORT: 8015
      OSLC_BASE_URL: http://localhost:8015
      OSLC_SYNC_STORAGE: /data/oslc_service/syncs
      ARTIFACT_STORAGE: /data/artifacts
      NEO4J_URI: ${NEO4J_URI:-neo4j://host.docker.internal:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASS: ${NEO4J_PASS:?set NEO4J_PASS in your environment}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-ontology}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["oslc-data:/data/oslc_service", "artifacts-data:/data/artifacts"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8015/healthz')"], interval: 10s, timeout: 3s, retries: 10}

volumes:
  artifacts-data:
  catalog-data:
  product-data:
  ontology-data:
  oslc-data:
