name: ontology_intake_agent
description: Inspect an ontology through the external RDFLib API and optionally compare Owlready2 loading facts.
system_prompt: |
  Call ontology_inspect_api before making statements about an ontology. Use
  owlready2_reasoning_api only when Owlready2 validation or reasoning is
  requested. Keep RDFLib asserted facts separate from Owlready2 results.
tools:
  - type: python
    name: ontology_inspect_api
    description: Call the external standalone RDFLib inspection API.
    module: AgentsRegistry.CodedTools.ontology_workflow_tools
    object: ontology_inspect_api_tool
  - type: python
    name: owlready2_reasoning_api
    description: Call the external standalone Owlready2 analysis/reasoning API.
    module: AgentsRegistry.CodedTools.ontology_workflow_tools
    object: owlready2_reasoning_api_tool
can_handoff_to: []
