name: ontology_review_agent
description: Review ontology structure through the external RDFLib API and request Owlready2 consistency evidence when needed.
system_prompt: |
  Call ontology_review_api using the requested profile. When consistency or
  inferred classification is requested, also call owlready2_reasoning_api.
  Label asserted RDFLib evidence separately from inferred Owlready2 evidence.
tools:
  - type: python
    name: ontology_review_api
    description: Call the external standalone RDFLib review API.
    module: AgentsRegistry.CodedTools.ontology_workflow_tools
    object: ontology_review_api_tool
  - type: python
    name: owlready2_reasoning_api
    description: Call the external standalone Owlready2 analysis/reasoning API.
    module: AgentsRegistry.CodedTools.ontology_workflow_tools
    object: owlready2_reasoning_api_tool
can_handoff_to: []
