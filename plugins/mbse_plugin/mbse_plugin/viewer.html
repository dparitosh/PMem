<!doctype html><html lang="en"><meta charset="utf-8"><title>MBSE model viewer</title>
<style>body{font:16px system-ui;background:#101c2c;color:#eef5fc;margin:24px}textarea{display:block;width:95%;height:100px}input,button,select{padding:8px;margin:6px}svg{width:100%;height:65vh;background:#182b40}text{fill:white;font-size:13px}circle{fill:#007e94;stroke:#54d8cf}line{stroke:#95a8b8}#message{color:#ffdb77}</style>
<h1>MBSE model viewer</h1><label>Plugin token <input id="token" type="password" autocomplete="off"></label>
<p>Import into an approved job to display its bounded source preview. Preview is not publication evidence.</p>
<label>Profile <select id="profile"><option>sysml-v1</option><option>sysml-v2</option></select></label><input id="file" type="file" aria-label="Model file">
<label>Job <input id="job" value="semantic-source-validation"></label><label>Version <input id="version" value="1.0.0"></label><button id="import">Import and preview</button>
<label for="batch">Or paste a normalized semantic batch</label><textarea id="batch">{"entities":[],"relationships":[]}</textarea><button id="render">Display batch</button>
<p id="message" role="status"></p><svg id="canvas" viewBox="0 0 1200 800" aria-label="Model graph"></svg>
<details><summary>Teamcenter/SMW mapping preview</summary>
<button id="template">Load draft template</button><label for="mapping">Mapping configuration</label><textarea id="mapping">{}</textarea>
<label for="records">Source records (JSON array)</label><textarea id="records">[]</textarea>
<label for="links">Source relationships (JSON array)</label><textarea id="links">[]</textarea>
<button id="preview">Validate mapping and visualize</button></details>
<script>
const ns='http://www.w3.org/2000/svg';let graph={nodes:[],edges:[]};
document.getElementById('template').onclick=async()=>{try{const r=await fetch(new URL('teamcenter-smw/template',location.href),{headers:{Authorization:'Bearer '+document.getElementById('token').value}});const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data));document.getElementById('mapping').value=JSON.stringify(data,null,2);}catch(e){message.textContent=e.message;}};
document.getElementById('preview').onclick=async()=>{try{const result=await call('teamcenter-smw/preview',{mapping:JSON.parse(document.getElementById('mapping').value),records:JSON.parse(document.getElementById('records').value),links:JSON.parse(document.getElementById('links').value)});await display({entities:result.entities,relationships:result.relationships});message.textContent=JSON.stringify({status:result.status,counts:result.counts,quality_errors:result.quality_errors});}catch(e){message.textContent=e.message;}};
async function call(path,payload){const r=await fetch(new URL(path,location.href),{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+document.getElementById('token').value},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data.detail));return data;}
function draw(selected){const canvas=document.getElementById('canvas');canvas.replaceChildren();function el(tag,attrs,text,parent=canvas){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;parent.append(e);return e;}const defs=el('defs',{}),marker=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:23,refY:5,markerWidth:7,markerHeight:7,orient:'auto'},'',defs);el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#95a8b8'},'',marker);const pos=new Map();graph.nodes.forEach((n,i)=>{let a=i*2*Math.PI/Math.max(graph.nodes.length,1);pos.set(n.id,n.id===selected?[600,400]:[600+320*Math.cos(a),400+320*Math.sin(a)]);});graph.edges.forEach(e=>{const a=pos.get(e.source),b=pos.get(e.target);el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],'marker-end':'url(#arrow)'});el('text',{x:(a[0]+b[0])/2,y:(a[1]+b[1])/2},e.label);});graph.nodes.forEach(n=>{const p=pos.get(n.id),c=el('circle',{cx:p[0],cy:p[1],r:14,tabindex:0,role:'button','aria-label':n.label});c.onclick=()=>draw(n.id);c.onkeydown=e=>{if(e.key==='Enter')draw(n.id)};el('text',{x:p[0]+17,y:p[1]+5},n.label);});}
async function display(batch){graph=await call('visualization',batch);draw();}
const message=document.getElementById('message');document.getElementById('render').onclick=async()=>{try{await display(JSON.parse(document.getElementById('batch').value));message.textContent=`${graph.nodes.length} nodes`;}catch(e){message.textContent=e.message;}};
document.getElementById('import').onclick=async()=>{try{const file=document.getElementById('file').files[0];if(!file||file.size>10000000)throw Error('Choose a model file up to 10 MB');const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(const b of bytes)binary+=String.fromCharCode(b);const result=await call('imports',{filename:file.name,profile:document.getElementById('profile').value,content_base64:btoa(binary),job_id:document.getElementById('job').value,job_version:document.getElementById('version').value});if(result.preview)await display(result.preview);message.textContent=`Job: ${result.status}; ${result.preview_scope||'preview unavailable'}`;}catch(e){message.textContent=e.message;}};
</script></html>
